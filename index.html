<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./assets/css/style.css" />

    <title>Frontend Mentor | E-commerce product page</title>
  </head>
  <body>
    <header class="header">
      <div class="header__brand">
        <div class="header__logo">
          <img src="./images/logo.svg" alt="Sneaker Company Logo" />
        </div>

        <nav class="header__nav">
          <ul class="header__nav-list">
            <li>
              <a href="#" class="header__nav-link">Collections</a>
            </li>

            <li>
              <a href="#" class="header__nav-link">Men</a>
            </li>

            <li>
              <a href="#" class="header__nav-link">Women</a>
            </li>

            <li>
              <a href="#" class="header__nav-link">About</a>
            </li>

            <li>
              <a href="#" class="header__nav-link">Contact</a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="header__user">
        <div class="header__cart">
          <img
            src="./images/icon-cart.svg"
            alt="Icon Cart"
            class="header__cart-img"
          />

          <div class="header__cart-details" id="header-cart-detail"></div>
        </div>

        <div class="header__profile">
          <img
            src="./images/image-avatar.png"
            alt="Image Avatar"
            class="header__profile-img"
          />
        </div>
      </div>
    </header>

    <main class="main"></main>
  </body>
</html>
